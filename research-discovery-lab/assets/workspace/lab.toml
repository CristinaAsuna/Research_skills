# discovery-lab 工作区配置。预算和容量上限只能通过已批准的 harness 提案修改。

[env]
python = "{{PYTHON}}"
assets = "assets"          # 工作区自有资产，不进 git
readonly_assets = []       # 只读复用的已下载权重/数据目录（绝对路径）

# 每台机器一节；本机标识来自 ~/.config/lab/machine。python 指运行实验和 tools/lab.py 的解释器（≥3.11）。
# runs_root 为空时，运行目录放在 topic 的 runs/ 下。
[machines.mac]
role = "指挥台：规划、写代码、分析；不放数据、权重和缓存"
ssh = ""
repo = ""
python = "{{PYTHON}}"
runs_root = ""

[skill]
path = "{{SKILL_PATH}}"

[budget]
topic_compute_minutes = 30
download_gb_without_approval = 1

[limits]
hard = ["AGENTS.md", "CLAUDE.md"]   # 超出行数上限按 ERROR 处理，其余文件超限只给 WARN
moves = 40
summary_figures = 8
figure_kb = 1024

[limits.lines]
"AGENTS.md" = 120
"CLAUDE.md" = 25
"README.md" = 60
"INSIGHTS.md" = 150
"DISCOVERY.md" = 150
"PLAN.md" = 200
"SUMMARY.md" = 200
"REFLECTION.md" = 80
